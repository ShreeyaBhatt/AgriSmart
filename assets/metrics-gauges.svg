<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #17140f; }
    .ring-track { fill: none; stroke: #2c2619; stroke-width: 14; }
    .ring-fill { fill: none; stroke: #8bc34a; stroke-width: 14; stroke-linecap: round; }
    .ring-fill.amber { stroke: #e3a857; }
    .num { font-family: Georgia, serif; font-size: 30px; fill: #ece4d3; text-anchor: middle; }
    .lbl { font-size: 11.5px; fill: #a99b85; text-anchor: middle; }
    .box { fill: #211c15; stroke: #3c3325; stroke-width: 1.2; }
    .check { fill: none; stroke: #8bc34a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 46; stroke-dashoffset: 46; animation: draw 0.7s ease-out 0.4s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .tick-circle { fill: none; stroke: #3c3325; stroke-width: 3;
      stroke-dasharray: 264; stroke-dashoffset: 264; animation: drawCircle 0.9s ease-out forwards; }
    @keyframes drawCircle { to { stroke-dashoffset: 0; } }
    .fadein { opacity: 0; animation: show 0.5s ease-out 1s forwards; }
    @keyframes show { to { opacity: 1; } }
  </style>

  <rect class="bg" width="680" height="240"/>

  <!-- gauge 1: macro-F1 0.966 -->
  <g transform="translate(110,120)">
    <circle class="ring-track" r="70" cx="0" cy="0" transform="rotate(-90)"/>
    <circle class="ring-fill" r="70" cx="0" cy="0" transform="rotate(-90)"
      stroke-dasharray="439.8" stroke-dashoffset="439.8">
      <animate attributeName="stroke-dashoffset" from="439.8" to="14.95" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <text class="num" y="8">0.966</text>
  </g>
  <text class="lbl" x="110" y="222">MACRO-F1 · HELD-OUT VAL</text>

  <!-- gauge 2: accuracy 0.967 -->
  <g transform="translate(340,120)">
    <circle class="ring-track" r="70" cx="0" cy="0" transform="rotate(-90)"/>
    <circle class="ring-fill amber" r="70" cx="0" cy="0" transform="rotate(-90)"
      stroke-dasharray="439.8" stroke-dashoffset="439.8">
      <animate attributeName="stroke-dashoffset" from="439.8" to="14.51" dur="1.6s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <text class="num" y="8">0.967</text>
  </g>
  <text class="lbl" x="340" y="222">ACCURACY · HELD-OUT VAL</text>

  <!-- tests passed badge -->
  <g transform="translate(500,50)">
    <rect class="box" width="160" height="140" rx="8"/>
    <g transform="translate(80,58)">
      <circle class="tick-circle" r="42" cx="0" cy="0"/>
      <path class="check" d="M-18,0 L-5,15 L20,-15"/>
    </g>
    <text class="fadein" x="80" y="118" text-anchor="middle" fill="#ece4d3" font-family="Georgia, serif" font-size="16">47 passed</text>
  </g>
</svg>
