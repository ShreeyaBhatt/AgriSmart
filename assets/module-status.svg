<svg viewBox="0 0 920 110" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #17140f; }
    .chip { stroke-width: 1.3; }
    .built { fill: #211c15; stroke: #5c8a3f; }
    .dim { fill: #1c1911; stroke: #3c3325; }
    .chip-lbl { font-size: 12px; fill: #ece4d3; }
    .chip-status { font-size: 10px; }
    .built .chip-status { fill: #8bc34a; }
    .dim .chip-status { fill: #8a7c68; }
    .pop { opacity: 0; transform: scale(0.7) translateY(6px); transform-box: fill-box; transform-origin: center;
      animation: pop 0.5s cubic-bezier(.2,.9,.3,1.3) forwards; }
    @keyframes pop { to { opacity: 1; transform: scale(1) translateY(0); } }
    .c0{animation-delay:0.05s;} .c1{animation-delay:0.2s;} .c2{animation-delay:0.35s;}
    .c3{animation-delay:0.5s;} .c4{animation-delay:0.65s;} .c5{animation-delay:0.8s;}
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  </style>
  <rect class="bg" width="920" height="110"/>

  <g class="pop c0" transform="translate(16,20)">
    <rect class="chip built" width="140" height="66" rx="6"/>
    <circle class="dot" cx="16" cy="16" r="3.5" fill="#8bc34a"/>
    <text class="chip-lbl" x="16" y="42">Core</text>
    <text class="chip-status built" x="16" y="58">✓ built</text>
  </g>

  <g class="pop c1" transform="translate(170,20)">
    <rect class="chip built" width="140" height="66" rx="6"/>
    <circle class="dot" cx="16" cy="16" r="3.5" fill="#8bc34a"/>
    <text class="chip-lbl" x="16" y="42">Module A</text>
    <text class="chip-status built" x="16" y="58">✓ built</text>
  </g>

  <g class="pop c2" transform="translate(324,20)">
    <rect class="chip built" width="140" height="66" rx="6"/>
    <circle class="dot" cx="16" cy="16" r="3.5" fill="#8bc34a"/>
    <text class="chip-lbl" x="16" y="42">Module C</text>
    <text class="chip-status built" x="16" y="58">✓ built</text>
  </g>

  <g class="pop c3" transform="translate(478,20)">
    <rect class="chip built" width="140" height="66" rx="6"/>
    <circle class="dot" cx="16" cy="16" r="3.5" fill="#8bc34a"/>
    <text class="chip-lbl" x="16" y="42">Module D</text>
    <text class="chip-status built" x="16" y="58">✓ built</text>
  </g>

  <g class="pop c4" transform="translate(632,20)">
    <rect class="chip built" width="140" height="66" rx="6"/>
    <circle class="dot" cx="16" cy="16" r="3.5" fill="#8bc34a"/>
    <text class="chip-lbl" x="16" y="42">Module E</text>
    <text class="chip-status built" x="16" y="58">✓ built</text>
  </g>

  <g class="pop c5" transform="translate(786,20)">
    <rect class="chip dim" width="118" height="66" rx="6"/>
    <circle cx="16" cy="16" r="3.5" fill="#8a7c68"/>
    <text class="chip-lbl" x="16" y="42" fill="#8a7c68">F / G</text>
    <text class="chip-status dim" x="16" y="58">not attempted</text>
  </g>
</svg>
