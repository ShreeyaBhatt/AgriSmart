<svg viewBox="0 0 920 200" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8bc34a"/>
    </marker>
  </defs>
  <style>
    .bg { fill: #17140f; }
    .node { fill: #211c15; stroke: #3c3325; stroke-width: 1.4; }
    .node.last { stroke: #5c8a3f; fill: #241f14; }
    .lbl-step { font-size: 10.5px; fill: #8a7c68; }
    .lbl-title { font-family: Georgia, serif; font-size: 15px; fill: #ece4d3; }
    .icon { stroke: #8bc34a; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .flow-line {
      stroke: #8bc34a; stroke-width: 2.2; stroke-dasharray: 7 6; fill: none;
      animation: march 1.1s linear infinite;
    }
    @keyframes march { to { stroke-dashoffset: -26; } }
    .pop {
      opacity: 0; transform: translateY(8px);
      animation: pop 0.6s ease-out forwards;
    }
    @keyframes pop { to { opacity: 1; transform: translateY(0); } }
    .n1 { animation-delay: 0.05s; } .n2 { animation-delay: 0.35s; }
    .n3 { animation-delay: 0.65s; } .n4 { animation-delay: 0.95s; }
  </style>

  <rect class="bg" width="920" height="200"/>

  <!-- connectors -->
  <path class="flow-line" d="M195,100 H230" />
  <path class="flow-line" d="M425,100 H460" />
  <path class="flow-line" d="M655,100 H690" />

  <!-- node 1: login -->
  <g class="pop n1" transform="translate(20,55)">
    <rect class="node" width="175" height="90" rx="6"/>
    <g class="icon" transform="translate(16,18)">
      <rect x="0" y="14" width="26" height="16" rx="3"/>
      <circle cx="13" cy="9" r="5"/>
    </g>
    <text class="lbl-step" x="16" y="56">01 · ENTER</text>
    <text class="lbl-title" x="16" y="76">Login</text>
  </g>

  <!-- node 2: my farm -->
  <g class="pop n2" transform="translate(250,55)">
    <rect class="node" width="175" height="90" rx="6"/>
    <g class="icon" transform="translate(16,14)">
      <path d="M13 0 L26 9 L13 18 L0 9 Z"/>
      <path d="M4 12 v9 M22 12 v9"/>
    </g>
    <text class="lbl-step" x="16" y="56">02 · ORIENT</text>
    <text class="lbl-title" x="16" y="76">My Farm</text>
  </g>

  <!-- node 3: scan leaf -->
  <g class="pop n3" transform="translate(480,55)">
    <rect class="node" width="175" height="90" rx="6"/>
    <g class="icon" transform="translate(16,14)">
      <path d="M2 6 h24 l-2 18 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 Z"/>
      <path d="M9 6 V4 a3 3 0 0 1 6 0 v2"/>
    </g>
    <text class="lbl-step" x="16" y="56">03 · CAPTURE</text>
    <text class="lbl-title" x="16" y="76">Scan a leaf</text>
  </g>

  <!-- node 4: diagnosis -->
  <g class="pop n4" transform="translate(710,55)">
    <rect class="node last" width="190" height="90" rx="6"/>
    <g class="icon" transform="translate(16,14)" stroke="#e3a857">
      <circle cx="13" cy="13" r="4.5"/>
      <path d="M13 0 v5 M13 21 v5 M0 13 h5 M21 13 h5 M4 4 l3.5 3.5 M18.5 18.5 L22 22 M22 4 l-3.5 3.5 M4 22 l3.5 -3.5"/>
    </g>
    <text class="lbl-step" x="16" y="56">04 · DECIDE</text>
    <text class="lbl-title" x="16" y="76">Diagnosis + Grad-CAM</text>
  </g>
</svg>
