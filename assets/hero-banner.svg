<svg viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glowGreen" cx="15%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#8bc34a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8bc34a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="90%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#e3a857" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e3a857" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="900" height="190" rx="10"/>
    </clipPath>
  </defs>

  <style>
    .bg { fill: #17140f; }
    .glow-a { animation: breathe 5s ease-in-out infinite; transform-origin: 130px 20px; }
    .glow-b { animation: breathe 6s ease-in-out infinite 1.2s; transform-origin: 800px 30px; }
    @keyframes breathe {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .leaf { animation: sway 3.2s ease-in-out infinite alternate; transform-origin: 66px 138px; }
    @keyframes sway {
      from { transform: rotate(-7deg); }
      to   { transform: rotate(6deg); }
    }
    .title {
      fill: #ece4d3; font-size: 46px; font-weight: 600;
      opacity: 0; transform: translateY(10px);
      animation: riseIn 0.9s cubic-bezier(.2,.8,.3,1) 0.15s forwards;
    }
    .title em { fill: #8bc34a; font-style: italic; }
    @keyframes riseIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .underline {
      transform: scaleX(0); transform-origin: left;
      animation: grow 0.8s ease-out 0.9s forwards;
    }
    @keyframes grow { to { transform: scaleX(1); } }
    .subtitle {
      font-family: 'Courier New', monospace; font-size: 15px; fill: #a99b85;
      opacity: 0; animation: fadeIn 0.8s ease-out 1.35s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .cursor {
      fill: #8bc34a; animation: blink 1s step-end infinite 1.35s;
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .kicker { font-family: 'Courier New', monospace; font-size: 12.5px; fill: #e3a857; letter-spacing: 0.4px; }
    .dot { fill: #8bc34a; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  </style>

  <g clip-path="url(#frame)">
    <rect class="bg" width="900" height="190"/>
    <rect class="glow-a" width="900" height="190" fill="url(#glowGreen)"/>
    <rect class="glow-b" width="900" height="190" fill="url(#glowAmber)"/>

    <!-- kicker -->
    <circle class="dot" cx="46" cy="34" r="3.5"/>
    <text class="kicker" x="58" y="38">SIH 2026 · L.J. Institute · PS-1 / C-433</text>

    <!-- leaf icon -->
    <g class="leaf" transform="translate(40,108)">
      <path d="M26 60 C26 30 42 12 66 6 C60 30 50 52 26 60Z" fill="none" stroke="#8bc34a" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M26 60 C26 24 10 6 -12 0 C-8 28 4 50 26 60Z" fill="none" stroke="#8bc34a" stroke-width="3.2" stroke-linejoin="round"/>
    </g>

    <!-- title -->
    <text class="title" x="130" y="105">AgriSmart <tspan fill="#8bc34a" font-style="italic">AI</tspan></text>
    <rect class="underline" x="132" y="118" width="330" height="4" rx="2" fill="#5c8a3f"/>

    <!-- subtitle -->
    <text class="subtitle" x="132" y="150">field-tested build, not a slide deck<tspan class="cursor"> ▍</tspan></text>
  </g>
</svg>
